name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild
        required: true
        type: string
      platform:
        description: Installer to rebuild, or publish completed artifacts
        required: true
        type: choice
        options: [macos-arm64, macos-x64, windows-x64, linux-x64, publish]
      base_run:
        description: Run with Intel Mac, Windows and firmware artifacts (publish only)
        type: string
      mac_run:
        description: Run with the Apple silicon artifact (publish only)
        type: string
      linux_run:
        description: Run with the Linux artifacts (publish only)
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.platform || 'all' }}

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    if: inputs.platform != 'publish'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["macos-arm64","macos-x64","windows-x64","linux-x64"]') }}
    runs-on: ${{ startsWith(matrix.platform, 'macos-') && 'macos-15-intel' || matrix.platform == 'windows-x64' && 'windows-2025' || 'ubuntu-22.04' }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Select build target
        id: target
        shell: bash
        run: |
          case "$PLATFORM" in
            macos-arm64) target=aarch64-apple-darwin; bundles=app ;;
            macos-x64) target=x86_64-apple-darwin; bundles=app ;;
            windows-x64) target=x86_64-pc-windows-msvc; bundles=nsis ;;
            linux-x64) target=x86_64-unknown-linux-gnu; bundles=deb,appimage ;;
          esac
          printf 'triple=%s\nbundles=%s\n' "$target" "$bundles" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.triple }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          mirror=
          for candidate in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://ubuntu.osuosl.org/ubuntu; do
            if curl -fLsSI --connect-timeout 5 --max-time 10 "$candidate/dists/jammy-security/InRelease" > /dev/null; then
              mirror="$candidate"
              break
            fi
          done
          [[ -n "$mirror" ]] || { echo 'No reachable Ubuntu package mirror'; exit 1; }
          source="$RUNNER_TEMP/mado-ubuntu.list"
          for suite in jammy jammy-updates jammy-security; do
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe\n' \
              "$mirror" "$suite" >> "$source"
          done
          options=(-o "Dir::Etc::sourcelist=$source" -o Dir::Etc::sourceparts=-
                   -o Acquire::Retries=1 -o Acquire::https::Timeout=15)
          sudo apt-get "${options[@]}" --error-on=any update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${options[@]}" \
            install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Check release version
        shell: bash
        run: |
          node --input-type=commonjs -e '
            const version = require("./src-tauri/tauri.conf.json").version;
            if (process.env.RELEASE_TAG !== "v" + version ||
                require("./package.json").version !== version) {
              throw new Error("Release tag and Studio versions must match");
            }'
      - run: npm ci
      - name: Build installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TARGET: ${{ steps.target.outputs.triple }}
          BUNDLES: ${{ steps.target.outputs.bundles }}
        run: npm run tauri -- build --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Collect installers
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.triple }}
        run: |
          shopt -s nullglob
          bundle="src-tauri/target/$TARGET/release/bundle"
          mkdir -p release
          if [[ "$RUNNER_OS" == macOS ]]; then
            app="$bundle/macos/Mado Studio.app"
            codesign --verify --deep --strict "$app"
            stage=$(mktemp -d)
            ditto "$app" "$stage/Mado Studio.app"
            ln -s /Applications "$stage/Applications"
            dmg="release/mado-studio-$RELEASE_TAG-$PLATFORM.dmg"
            hdiutil create -volname 'Mado Studio' -srcfolder "$stage" -format UDZO "$dmg"
            hdiutil verify "$dmg"
          else
            case "$RUNNER_OS" in
              Windows) files=("$bundle"/nsis/*.exe); expected=1 ;;
              Linux) files=("$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage); expected=2 ;;
            esac
            [[ ${#files[@]} -eq "$expected" ]]
            for file in "${files[@]}"; do
              cp "$file" "release/mado-studio-$RELEASE_TAG-$PLATFORM.${file##*.}"
            done
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  firmware:
    name: Firmware (ESP32-C5)
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: ./firmware/setup-resources.sh
      - run: uv run --python 3.12 --script firmware/tools/build_fonts.py
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c5
          path: firmware
      - name: Package firmware
        run: python3 firmware/tools/package_release.py firmware/build "$GITHUB_REF_NAME" release
      - uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: always() && (inputs.platform == 'publish' || (github.event_name == 'push' && needs.desktop.result == 'success' && needs.firmware.result == 'success'))
    needs: [desktop, firmware]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        if: github.event_name == 'push'
        with:
          path: release
          merge-multiple: true
      - name: Wait for targeted rebuilds
        if: inputs.platform == 'publish'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.base_run }}
          MAC_RUN: ${{ inputs.mac_run }}
          LINUX_RUN: ${{ inputs.linux_run }}
        run: |
          for id in "$BASE_RUN" "$MAC_RUN" "$LINUX_RUN"; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo 'Recovery run IDs must be numeric'; exit 1; }
          done
          while :; do
            pending=0
            for id in "$MAC_RUN" "$LINUX_RUN"; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
                --jq 'if .status == "completed" then .conclusion else "pending" end')
              case "$state" in
                success) ;;
                pending) pending=1 ;;
                *) echo "Targeted build $id ended with $state"; exit 1 ;;
              esac
            done
            [[ "$pending" == 0 ]] && break
            sleep 20
          done
      - uses: actions/download-artifact@v7
        if: inputs.platform == 'publish'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.base_run }}
          pattern: '{macos-x64,windows-x64,firmware}'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v7
        if: inputs.platform == 'publish'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.mac_run }}
          name: macos-arm64
          path: release
      - uses: actions/download-artifact@v7
        if: inputs.platform == 'publish'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_run }}
          name: linux-x64
          path: release
      - name: Publish installers and firmware together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd release
          tag="$RELEASE_TAG"
          assets=(
            "mado-studio-$tag-macos-arm64.dmg"
            "mado-studio-$tag-macos-x64.dmg"
            "mado-studio-$tag-windows-x64.exe"
            "mado-studio-$tag-linux-x64.deb"
            "mado-studio-$tag-linux-x64.AppImage"
            "mado-firmware-$tag-tdisplay-c5-v1.0-install.zip"
            "mado-firmware-$tag-tdisplay-c5-v1.0-upgrade.zip"
          )
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          - macOS 提供 Apple 芯片与 Intel 芯片的 DMG。应用使用本地签名，未经过 Apple 公证。
          - Windows x64 提供 NSIS 安装程序，未使用代码签名证书签名。
          - Linux x64 提供 Debian 安装包和 AppImage。
          - T-Display-C5 V1.0 首次安装选 `install.zip`。已有 Mado 固件时选 `upgrade.zip`，保留字库和设备配置。在 Studio 的「设备连接 → 烧录固件」选择 ZIP。
          NOTES
          gh release create "$tag" "${assets[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Mado $tag" --notes-file notes.md
